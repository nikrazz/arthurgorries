#################### default parameters ############################
favicon = "images/favicon.png"
logo = "images/logo.png"
logo_darkmode = "images/logo-darkmode.png"
logo_width = "160px"
logo_height = "32px"
logo_webp = true
# show when logo is missing
logo_text = "Arthur Gorries"
navbar_fixed = true
theme_switcher = false
theme_default = "dark" # available options [light/dark/system]
mainSections = ["blog"]
#contact_form_action = "#" # contact form works with [https://airform.io/] or [https://formspree.io]
# google_tag_manager = ""
# google_adsense = ""
# custom script on header, example: custom_script= "<script>console.log(\"Hello World\")</script>"
# custom_script = ""
# copyright
copyright = "Designed & Developed by Nikolai Razouvaev"

[preloader]
enable = false
preloader = "" # use jpg, png, svg or gif format.

[navigation_button]
enable = false
label = "Github"
link = "https://github.com/zeon-studio/hugoplate"

# LLMs Configuration
# LLMs module: https://github.com/gethugothemes/hugo-modules/tree/master/llms-txt
[llms]
# Set to false to disable /llms.txt generation
generate_llms_txt = true
# Set to false to disable /llms-full.txt generation
generate_llms_full_txt = true
# Limit to specific paths (e.g. "/about/", "/blog/*", "/blog/**"). Empty = all pages.
include = []
# Exclude specific paths (same wildcard formats as include). Include takes priority on conflicts.
exclude = []

[search]
enable = false
primary_color = "#121212"
include_sections = ["blog"]
show_image = true
show_description = true
show_tags = true
show_categories = true

[announcement]
enable = false
expire_days = 7
content = "<span class='text-center block'>♥️ Loving Hugoplate? <a class='underline' href='https://github.com/zeon-studio/hugoplate' target='_blank' rel='noopener'>Please ⭐️ on Github</a></span>"

# seo meta data for OpenGraph / Twitter Card
[metadata]
keywords = ["Arthur Gorries", "Punk band", "Music", "Rock", "Alternative", "Indie"]
description = "Artur Gorries is a punk band from Brisbane, Australia known for their energetic performances and rebellious spirit. Explore their music, tour dates, and latest news."
author = "Nikolai Razouvaev"
# twitter = "zeon_studio"
image = "images/og-arthur-gorries.png"

[site_verification]
# google = ""
# bing = ""
# baidu = ""
# facebook = ""
# mastodon = ""

[cookies]
enable = false
expire_days = 60
content = "This site uses cookies. By continuing to use this website, you agree to their use."
button = "I Accept"

# diagrams
[mermaid]
js_url = 'https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.esm.min.mjs'

######################## sidebar widgets #########################
[widgets]
sidebar = ["categories", "tags"]


# google map
[google_map]
enable = false
map_api_key = ""
map_latitude = ""
map_longitude = ""
map_marker = "images/marker.png"


# Subscription
[subscription]
enable = false
# mailchimp subsciption
mailchimp_form_action = ""
mailchimp_form_name = ""

